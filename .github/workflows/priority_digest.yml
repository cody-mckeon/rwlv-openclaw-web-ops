name: Priority Governor Daily Digest

on:
  workflow_dispatch:

  schedule:
    # 8:30 AM Las Vegas time during daylight saving time.
    # GitHub Actions schedules run in UTC unless timezone is specified.
    - cron: "30 15 * * 1-5"

concurrency:
  group: priority-governor-digest
  cancel-in-progress: true

jobs:
  send-digest:
    runs-on: ubuntu-latest

    env:
      ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
      ASANA_MODE: ${{ secrets.ASANA_MODE }}
      ASANA_TEST_PROJECT_GID: ${{ secrets.ASANA_TEST_PROJECT_GID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generate current priorities from Asana
        run: |
          python -m skills.asana.actions.generate_current_priorities

      - name: Send Telegram priority digest
        run: |
          python scripts/send_priority_digest.py

      - name: Upload generated priority snapshot for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-priorities-generated
          path: CURRENT_PRIORITIES.generated.md
          if-no-files-found: ignore
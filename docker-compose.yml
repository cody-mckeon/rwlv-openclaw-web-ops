services:
  rwlv-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    env_file:
      - .env
    environment:
      RUNTIME_HEARTBEAT_INTERVAL_SECONDS: ${RUNTIME_HEARTBEAT_INTERVAL_SECONDS:-300}
      RUNTIME_SCHEDULER_POLL_SECONDS: ${RUNTIME_SCHEDULER_POLL_SECONDS:-1}
      RUNTIME_JOB_GENERATE_PRIORITIES_INTERVAL_SECONDS: ${RUNTIME_JOB_GENERATE_PRIORITIES_INTERVAL_SECONDS:-1800}
      RUNTIME_JOB_PRIORITY_DIGEST_INTERVAL_SECONDS: ${RUNTIME_JOB_PRIORITY_DIGEST_INTERVAL_SECONDS:-1800}
      RUNTIME_JOB_TELEMETRY_SUMMARY_INTERVAL_SECONDS: ${RUNTIME_JOB_TELEMETRY_SUMMARY_INTERVAL_SECONDS:-3600}
    volumes:
      - .:/app
      - ./generated:/app/generated
    restart: unless-stopped
    command: ["python3", "-m", "runtime.scheduler"]

# RWLV operational runtime configuration.
# This repository is the RWLV client implementation boundary,
# so non-secret runtime settings live here instead of an extra clients/rwlv tree.

timezone: UTC

priority_digest:
  top_items_per_section: 5
  heartbeat_file: HEARTBEAT.priority_digest.md
  state_file: generated/logs/priority_digest_state.json
  schedule:
    enabled: true
    timezone: UTC
    weekdays: [0, 1, 2, 3, 4]
    window_start: "08:30"
    max_sends_per_day: 1
    cooldown_seconds: 21600

operational_intelligence:
  enabled: true
  debug: true

paths:
  generated_dir: generated
  snapshots_dir: generated/snapshots
  logs_dir: generated/logs
  telemetry_dir: generated/telemetry

logging:
  runtime_log_file: runtime.jsonl


scheduler_runtime:
  mode: deterministic_internal_scheduler
  heartbeat_interval_seconds: 300
  poll_interval_seconds: 1
  jobs:
    generate_current_priorities_interval_seconds: 1800
    send_priority_digest_interval_seconds: 1800
    generate_telemetry_summary_interval_seconds: 3600
